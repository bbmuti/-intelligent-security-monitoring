name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_scope_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_scope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate database migration
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: alembic upgrade head
      - name: Lint
        run: ruff check app tests scripts migrations
      - name: Security scan
        run: bandit -q -r app scripts ../examples
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Test with coverage gate
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Run deterministic model smoke evaluation
        run: python -m scripts.evaluate_model
      - name: Exercise migrated PostgreSQL API
        env:
          DATABASE_URL: postgresql+psycopg://sentinel:sentinel-ci@localhost:5432/sentinel_scope_ci
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: ci-admin-password
          INGESTION_API_KEY: ci-ingestion-key-with-sufficient-length
        run: |
          alembic upgrade head
          python -m scripts.postgres_smoke

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: |
          pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt
          npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run analyst browser flow
        env:
          DATABASE_URL: sqlite:///./e2e.db
          JWT_SECRET: e2e-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: e2e-admin-password
          INGESTION_API_KEY: e2e-ingestion-key-with-sufficient-length
        run: npm run test:e2e

  windows-collector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate PowerShell collector syntax
        shell: pwsh
        run: |
          $source = Get-Content collectors/windows_security_eventlog.ps1 -Raw
          [void][scriptblock]::Create($source)

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag sentinelscope-api:test backend
      - run: docker build --tag sentinelscope-web:test frontend
