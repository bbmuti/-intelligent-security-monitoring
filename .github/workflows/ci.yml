name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate database migration
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: alembic upgrade head
      - name: Lint
        run: ruff check app tests scripts migrations
      - name: Security scan
        run: bandit -q -r app scripts ../examples
      - name: Test with coverage gate
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Run deterministic model smoke evaluation
        run: python -m scripts.evaluate_model

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
