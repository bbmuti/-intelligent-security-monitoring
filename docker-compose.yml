services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_scope
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_scope"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel-local@db:5432/sentinel_scope
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
